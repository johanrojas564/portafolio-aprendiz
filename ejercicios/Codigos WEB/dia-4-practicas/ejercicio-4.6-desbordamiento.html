<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio: corrige el desbordamiento horizontal</title>
  <style>
    /* Esta página se ve mal en celulares: aparece una barra de desplazamiento horizontal.
       Encuentra y corrige TODOS los problemas. */

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .pagina {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .banner {
      max-width: 100%;
      padding: 20px;
      background-color: #1d4ed8;
      color: #ffffff;
    }
    img{
      max-width: 100%;
      height: auto;
      display: block;
    }
    .fila {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .fila .columna {
      flex: 1 1 280px;
      width: 400px;
      padding: 20px;
      border: 2px solid #94a3b8;
    }

    .nombre-largo {
      white-space: wrap;
    }
  </style>
</head>
<body>

  <div class="pagina"> <!-- La clase de pagina tiene un ancho fijo -->
    <div class="banner"><h1>Mi tienda en línea</h1></div><!--La distancia del banner se suma con el cuerpo y los supera-->

    <img src="img/cafe-hero.svg" alt="Taza de café humeante" width="1600" height="700"> <!--La imagen tiene un ancho muy alto y no adaptativo-->

    <div class="fila"> <!-- Las filas no tienen un flex box que contenga su propio ancho  -->
      <div class="columna"><h2>Envíos</h2><p>Enviamos a todo el país.</p></div>
      <div class="columna"><h2>Pagos</h2><p>Aceptamos tarjetas y transferencias.</p></div>
      <div class="columna"><h2>Soporte</h2><p>Atención de lunes a sábado.</p></div>
    </div>

    <p class="nombre-largo">Producto: Cafetera de acero inoxidable de gran capacidad con filtro reutilizable y jarra térmica</p>
    <!-- La propiedad no Wrap obliga a que el texto se desborde-->
  </div>
<!--
  Soluciones: 
  Se cambio el ancho fijo de pagina a un width de 100%
  El banner  se le  dejo su ancho en 100%
  Se añadio una regla de CSS a la imagen, para ajustar el ancho y alto, eliminando las medidas fijas 
  Se añadio flex wrap, para permitir que puedan saltar de linea 
  Se cambio la propiedad del nombre largo a wrap para que no se salgoan  
  -->
</body>
</html>
