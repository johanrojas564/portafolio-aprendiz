<!DOCTYPE html> <!-- No se define con DOCTYPE que tipo de archivo es. -->
<html lang="es "> <!--No se especifica que idioma usa-->
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina corregida </title> <!-- La etiqueta title esta incompleta-->
</head>
<body>
    <h1> Mi ciudad </h1> <!--La etiqueta h1 le falta su parte de cierre-->
    <p>Vivo en una ciudad muy bonita donde <strong>siempre hay algo por hacer.</strong></p> <!--	Debajo de h1 el párrafo y el STRONG tienen un desorden con sus etiquetas de cierre -->
    <br>
    <h2>Lugares favoritos</h2> <!--	Hay un salto de h1 a h4  -->
    <p>
        Mi lugar preferido es el parque central. <!--	El primer párrafo esta sin etiqueta de cierre -->
    </p>
    <br>
    <p> 
        Mas información en: <a href="https://es.wikipedia.org">Wikipedia</a> <!-- El primer enlace tiene un hrf en vez de href -->
    </p>
    <h2> Contacto </h2> <!-- Hay un salto de h4 a h2 -->
    <p>Escríbeme a <a href=mailto:yo@ejemplo.com>yo@ejemplo.com</a></p>
    <br>
    <p>Fin de la página</p> <!-- Hay un parrafo fuera del cuerpo-->
    
    <!-- Todos los errores corregidos tiene su nota al lado, se obviaron errores con la sangria del codigo y la falta de saltos de linea para separar el texto -->
</body>
</html>
