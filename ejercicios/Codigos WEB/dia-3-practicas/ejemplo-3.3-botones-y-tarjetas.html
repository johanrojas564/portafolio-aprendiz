<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botones y tarjetas</title>
  <!-- CSS externo: el archivo estilos-3.3.css está en esta misma carpeta -->
  <link rel="stylesheet" href="estilos-3.3.css">
</head>
<body>

  <h1>Botones y tarjetas con CSS</h1>

  <p>
    <a class="boton" href="#">Botón principal</a>
    <a class="boton boton-secundario" href="#">Botón secundario</a>
  </p>

  <article class="tarjeta">
    <img src="img/cafe-1.svg" alt="Taza de café espresso" width="600" height="400">
    <div class="tarjeta-texto">
      <h2>Espresso de origen</h2>
      <p>Intenso, con notas a chocolate y caramelo.</p>
      <p class="precio">$5.500</p>
    </div>
  </article>

</body>
</html>
